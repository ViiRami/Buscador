<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Cruelty-Free - Huella Consciente</title>
    <!-- Tipografía Quicksand desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg-cream: #FFF3E3;
            --color-card-bg: #9BAC92;
            --color-sage-green: #536254;
            --color-sage-hover: #FFF3E4;
            --color-text-main: #FFF3E4;
            --color-text-muted: #FFF3E4;
            --color-border: #c0e0d0;
            --font-main: 'Quicksand', sans-serif; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Prevent double scrollbars on the outer window */
        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #FFF3E4;
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Exact fixed dimensions 1848px x 801px, no scrolling */
        .app-container {
            width: 1848px;
            height: 801px;
            max-width: 100vw;
            max-height: 100vh;
            background-color: var(--color-bg-cream);
            border: 2px solid var(--color-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Elimina cualquier scroll interno */
            padding: 30px 50px;
            box-shadow: 0 15px 35px rgba(59, 110, 74, 0.1);
        }

        /* Panel de Filtros Superior optimizado en altura */
        .filters-panel {
            display: flex;
            gap: 25px;
            background-color: #9BAC92; 
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid var(--color-border);
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 250px;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--color-text-main);
            font-size: 0.95rem;
        }

        .filter-group select {
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid var(--color-border);
            background-color: #b5ac9a; 
            font-family: var(--font-main);
            font-size: 0.95rem;
            color: var(--color-text-main);
            outline: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .filter-group select:focus {
            border-color: var(--color-sage-green);
            box-shadow: 0 0 0 3px #b5ac9a;
        }

        /* Cuadrícula Adaptativa ajustada al contenedor fijo sin desbordar */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 columnas fijas limpias para 1848px */
            gap: 20px;
            flex-grow: 1;
            overflow-y: auto; /* Permite desplazamiento interno solo si los resultados superan la altura disponible */
            padding-right: 5px;
        }

        /* Estilos de la barra de desplazamiento interna estética si fuese necesaria */
        .cards-grid::-webkit-scrollbar {
            width: 8px;
        }
        .cards-grid::-webkit-scrollbar-track {
            background: rgba(181, 172, 154, 0.3);
            border-radius: 10px;
        }
        .cards-grid::-webkit-scrollbar-thumb {
            background-color: var(--color-sage-green);
            border-radius: 10px;
        }

        /* Estructura Modular de Tarjeta optimizada */
        .card {
            background-color: var(--color-card-bg);
            border-radius: 14px;
            border: 1px solid var(--color-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 12px #b5ac9a;
            height: 100%;
            max-height: 290px;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(59, 110, 74, 0.12);
        }

        .card-image-container {
            width: 100%;
            height: 110px;
            background-color: #F4EADF; 
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .card-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-origin {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #778C77; 
            color: #FFF3E4;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        .card-brand-link {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--color-sage-green);
            text-decoration: none;
            display: inline-block;
            transition: color 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-brand-link:hover {
            color: var(--color-sage-hover);
            text-decoration: underline;
        }

        .card-title {
            font-size: 0.85rem;
            color: var(--color-text-main);
            font-weight: 600;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-certification {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--color-text-muted);
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 8px;
            border-top: 1px solid #3c463c; 
        }

        .card-category {
            font-size: 0.75rem;
            background-color: #778C77; 
            padding: 3px 8px;
            border-radius: 6px;
            color: var(--color-text-muted);
            font-weight: 500;
        }

        .card-price {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--color-text-main);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: var(--color-text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>

            {
                name: "Anastasia Beverly Hills",
                product: "Paleta de Sombras Soft Glam Eye Shadow Palette",
                category: "Sombras",

                priceNumeric: 217000,
                priceFormatted: "$217,000 COP",
                certification: "Aparece en el listado de PETA para Colombia.",

                image: "https://prebel.vtexassets.com/arquivos/ids/205896/4059729550507.jpg?v=639196628933700000"
            }
        ];

        function displayProducts(productsToDisplay) {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            productsToDisplay.sort((a, b) => a.priceNumeric - b.priceNumeric);

            if (productsToDisplay.length === 0) {
                grid.innerHTML = '<div class="no-results">No se encontraron productos con los filtros seleccionados.</div>';
                return;
            }

            productsToDisplay.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                card.innerHTML = `
                    <div class="card-image-container">
                        <span class="badge-origin">${item.origin}</span>
                        <img src="${item.image}" alt="${item.product}">
                    </div>
                    <div class="card-content">
                        <a href="${item.brandUrl}" target="_blank" class="card-brand-link">${item.name}</a>
                        <div class="card-title">${item.product}</div>
                        <div class="card-certification">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#3B6E4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:2px;"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M10 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M12 18c-3 0-5-2-5-5 0-3 2-5 5-5s5 2 5 5c0 3-2 5-5 5z"/></svg>
                            <span>${item.certification}</span>
                        </div>
                        <div class="card-footer">
                            <span class="card-category">${item.category}</span>
                            <span class="card-price">${item.priceFormatted}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts() {
            const origin = document.getElementById('originFilter').value;
            const product = document.getElementById('productFilter').value;

            let filtered = makeupData.filter(item => {
                const matchesOrigin = (origin === 'all' || item.origin === origin);
                const matchesProduct = (product === 'all' || item.category === product);
                return matchesOrigin && matchesProduct;
            });

            displayProducts(filtered);
        }

        window.onload = () => {
            displayProducts(makeupData);
        };
    </script>
</body>
